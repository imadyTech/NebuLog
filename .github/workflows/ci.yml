name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - run: npm ci
      # `npm run lint` also runs the raw-HTML check (WO-0006 §6: no dangerouslySetInnerHTML or
      # innerHTML anywhere in src/) and the WCAG contrast check.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: src/NebuLog.Server.Host/wwwroot

  dotnet:
    runs-on: ubuntu-latest
    needs: dashboard
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: src/NebuLog.Server.Host/wwwroot
      - run: dotnet restore NebuLog.slnx
      - run: dotnet build NebuLog.slnx --no-restore -c Release
      - run: dotnet test NebuLog.slnx --no-build -c Release
      - run: dotnet pack NebuLog.slnx --no-build -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
